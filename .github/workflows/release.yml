name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Each deploy needs its secrets, so the workflow stays green until the accounts exist.
  secrets:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.check.outputs.site }}
      native: ${{ steps.check.outputs.native }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Public pages deploy skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/publishing.md)."
          fi
          if [ -n "$EXPO_TOKEN" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Store builds skipped: set EXPO_TOKEN (docs/publishing.md)."
          fi

  # The public pages only (legal pages, association file, app-config.json): the web app is the Vue
  # PWA, released from its own repository.
  site:
    needs: secrets
    if: needs.secrets.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tourenbuddy-native --branch=main

  native:
    needs: secrets
    if: needs.secrets.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # EAS builds and signs the iOS app, raises its build number and, once the build finishes,
      # submits it to TestFlight. Android joins later (docs/publishing.md, "Android (later)").
      - run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Each deploy needs its secrets, so the workflow stays green until the accounts exist.
  secrets:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.check.outputs.site }}
      native: ${{ steps.check.outputs.native }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Public pages deploy skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/publishing.md)."
          fi
          if [ -n "$EXPO_TOKEN" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Store builds skipped: set EXPO_TOKEN (docs/publishing.md)."
          fi

  # The public pages (legal pages, association file, app-config.json) and, once the repository
  # variable WEB_DEPLOY is `true` (the web cutover, docs/publishing.md), the web app with them: the
  # export copies `public/` into `dist/`. Until then the Vue repository releases the web app.
  site:
    needs: secrets
    if: needs.secrets.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB: ${{ vars.WEB_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - if: env.WEB == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.WEB == 'true'
        run: npm ci
      # A build without its backend would deploy an app that cannot start: fail instead.
      - if: env.WEB == 'true'
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::WEB_DEPLOY needs the secrets SUPABASE_URL and SUPABASE_ANON_KEY (docs/publishing.md)."
            exit 1
          fi
          npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_NOTIFY_HOOK_URL: ${{ secrets.NOTIFY_HOOK_URL }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.WEB == 'true' && 'dist' || 'public' }} --project-name=tourenbuddy-native --branch=main

  native:
    needs: secrets
    if: needs.secrets.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # EAS builds and signs the iOS app, raises its build number and, once the build finishes,
      # submits it to TestFlight. Android joins later (docs/publishing.md, "Android (later)").
      - run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
